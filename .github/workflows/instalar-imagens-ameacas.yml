name: Instalar fotos principais da Wiki no NEX
on:
  push:
    paths:
      - 'nex_wiki_main_images*.zip'
      - '.github/workflows/instalar-imagens-ameacas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar-retratos:
    runs-on: ubuntu-latest
    steps:
      - name: Carregar projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar somente os retratos PNG principais
        shell: bash
        run: |
          set -euo pipefail
          archive=""
          for candidate in nex_wiki_main_images.zip "nex_wiki_main_images (1).zip"; do
            if [ -f "$candidate" ]; then
              archive="$candidate"
              break
            fi
          done
          if [ -z "$archive" ]; then
            echo "Nenhum pacote ZIP de imagens da Wiki encontrado"
            exit 1
          fi
          echo "Pacote encontrado: $archive"
          count="$(unzip -Z1 "$archive" | grep -Ec '^assets/ameacas/(livro-basico|sobrevivendo-ao-horror)/[^/]+\.png$')"
          echo "Total de retratos PNG: $count"
          test "$count" -eq 44
          unzip -o -q "$archive" 'assets/ameacas/*/*.png' -d .
          find assets/ameacas -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -delete
          test "$(find assets/ameacas -type f -name '*.png' | wc -l)" -ge 44
      - name: Publicar retratos e remover antigos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/ameacas
          if ! git diff --cached --quiet; then
            git commit -m "Instalar 44 retratos PNG da Wiki e excluir imagens antigas"
            git push
          else
            echo "Retratos já instalados"
          fi
