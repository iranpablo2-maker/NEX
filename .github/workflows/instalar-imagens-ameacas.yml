name: Instalar fotos principais da Wiki no NEX
on:
  push:
    paths:
      - 'nex_wiki_main_images.zip'
      - '.github/workflows/instalar-imagens-ameacas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalar-retratos:
    runs-on: ubuntu-latest
    steps:
      - name: Carregar projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar somente fotos principais novas
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f nex_wiki_main_images.zip ]; then
            echo "Aguardando envio do pacote nex_wiki_main_images.zip"
            exit 0
          fi
          count="$(unzip -Z1 nex_wiki_main_images.zip | grep -Ec '^assets/ameacas/(livro-basico|sobrevivendo-ao-horror)/[^/]+\.png$')"
          echo "Novos retratos principais encontrados: $count"
          test "$count" -eq 44
          unzip -o -q nex_wiki_main_images.zip 'assets/ameacas/*/*.png' -d .
          find assets/ameacas -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -delete
          test "$(find assets/ameacas -type f -name '*.png' | wc -l)" -ge 44
      - name: Publicar e remover imagens antigas
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f nex_wiki_main_images.zip ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/ameacas
          if ! git diff --cached --quiet; then
            git commit -m "Instalar 44 retratos principais PNG e retirar fotos antigas"
            git push
          else
            echo "Retratos já instalados."
          fi
