<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Ameaça | NEX</title>
<style>
:root{color-scheme:dark;--bg:#0a090c;--panel:#171317;--red:#b42f40;--border:#4d3038;--muted:#c6b2ba}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px/1.5 system-ui,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ef8490;outline-offset:2px}
.shell{max-width:1060px;margin:0 auto;padding:23px 20px 50px}
nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:12px}
nav a{color:#f0c7ce;text-decoration:none;font-weight:600}nav a:hover{text-decoration:underline}
.brand{letter-spacing:.16em;font:700 22px Georgia,serif;color:#fff}
.card{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.hero{display:flex;position:relative;isolation:isolate;gap:20px;padding:24px;min-height:184px;align-items:center;background:var(--art,linear-gradient(110deg,#46131c,#151016));background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#100b10f0,#100b10af 75%,#100b105c)}
.portrait{flex:0 0 144px;height:144px;border-radius:9px;border:1px solid #6e3740;background:#260f17a8;display:grid;place-items:center;font:700 65px Georgia,serif;background-position:center;background-size:cover}
.hero h1{font-size:27px;margin:4px 0 6px;line-height:1.2}.eyebrow{color:#f0b0bb;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tags span{border:1px solid #85404d;background:#351921c9;border-radius:5px;padding:3px 8px;font-size:11px}
.hp{display:flex;align-items:center;background:#a92337;border:1px solid #db4a5f;margin:20px 20px 10px;height:46px;border-radius:7px}
.hp[hidden]{display:none}.hp button{border:0;background:transparent;color:white;font-size:23px;padding:5px 13px}.hp button:hover{background:#ffffff24}.hp strong{flex:1;text-align:center;font-size:17px}
.tabs{display:flex;gap:15px;justify-content:center;padding:12px 12px 0;border-bottom:1px solid #34292d}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:#b8a5ad;padding:10px 14px;text-transform:uppercase;font-size:12px}
.tabs button[aria-selected="true"]{color:white;border-color:#db3d50}
.page{padding:24px}.page[hidden]{display:none}
.attributes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;text-align:center;margin-bottom:22px}
.attributes small{display:block;color:#c7b3bd}.attributes strong{display:block;font:500 28px Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#22171d;border:1px solid #4a323b;border-radius:8px;padding:12px}.stat small{display:block;color:#cdb6be;font-size:11px}.stat strong{font-size:17px}
h2{font-size:18px;font-weight:600;margin:22px 0 9px}.skills{display:grid;gap:6px}
.skill{display:flex;justify-content:space-between;gap:12px;padding:10px;border:1px solid #372b31;border-radius:5px}
.skill button{color:#fff;background:#3b202b;border:1px solid #7c4350;border-radius:5px}
.lines{white-space:pre-line;color:#e7dce0;font-size:13px;margin:0}.muted{color:var(--muted)}.note{border-left:3px solid var(--red);background:#21171c;padding:12px;margin:18px 0;color:#d9bbc5}
.action{border:1px solid #49323a;background:#23181e;padding:14px;border-radius:7px;margin-bottom:10px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:17px 0}
.btn{border:1px solid #d05867;border-radius:6px;background:#ac3040;color:#fff;padding:9px 14px;font-weight:650}
.form{display:grid;gap:12px;background:#21171c;padding:16px;border:1px solid #613442;border-radius:8px}
.form[hidden]{display:none}.form label{display:flex;flex-direction:column;gap:5px;color:#e0bfc9;font-size:12px}
.form :is(input,textarea){background:#0e0b10;border:1px solid #73505c;border-radius:6px;color:white;padding:10px;width:100%;min-width:0}
.form textarea{resize:vertical;min-height:64px}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.form-grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
#missing{padding:40px;text-align:center}
@media(max-width:620px){.shell{padding:12px 9px 36px}.hero{padding:12px;gap:11px;min-height:122px}.portrait{flex-basis:96px;height:96px;font-size:40px}.hero h1{font-size:19px}.page{padding:16px 12px}.hp{margin:12px 12px 5px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{gap:2px}.tabs button{padding:10px 8px}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<div class="tabs" role="tablist" aria-label="Seções da ficha">
<button type="button" data-tab="status" aria-selected="true">Status</button><button type="button" data-tab="combat" aria-selected="false">Combate</button><button type="button" data-tab="description" aria-selected="false">Descrição</button>

<div class="page" id="status"></div><div class="page" id="combat" hidden></div><div class="page" id="description" hidden></div>

<form id="editor" class="form" hidden>
<div class="form-grid"><label>VD<input id="f-vd" type="number" min="0"></label><label>PV<input id="f-pv" type="number" min="0"></label><label>Defesa<input id="f-defense" type="number" min="0"></label><label>Deslocamento<input id="f-movement"></label></div>

<label>Foto da ameaça<input id="f-photo" type="file" accept="image/png,image/jpeg,image/webp"></label>
<label>Perícias (Nome | 3d20+10, uma por linha)<textarea id="f-skills"></textarea></label>
<label>Sentidos<textarea id="f-senses"></textarea></label><label>Elementos secundários<textarea id="f-secondary"></textarea></label>
<label>Imunidades<textarea id="f-immunities"></textarea></label><label>Resistências<textarea id="f-resistances"></textarea></label><label>Vulnerabilidades<textarea id="f-weaknesses"></textarea></label>
<label>Ataques e habilidades próprias<textarea id="f-attacks"></textarea></label><label>Descrição própria<textarea id="f-description"></textarea></label>
<div><button class="btn" type="submit">Salvar alterações</button></div>
</form>
</div></div>

function threatKey(x){return x.source+"::"+x.name;}

let hpNow=null,hpMax=null,activeTab="status";
function n(v){return v===null||v===undefined||v===""?"—":v;}
function lines(arr){return Array.isArray(arr)&&arr.length?arr.map(v=>esc(v)).join("<br>"):'<span class="muted">Não cadastrado</span>'}
function section(title,data){return '<h2>'+esc(title)+'</h2><div class="lines">'+lines(data)+'</div>'}
function getData(){return threatFacts(threat)}
function activate(tab){activeTab=tab;for(const x of ["status","combat","description"]){$(x).hidden=x!==tab;document.querySelector('[data-tab="'+x+'"]').setAttribute("aria-selected",String(x===tab))}}
function render(){
 if(!threat)return;
 const d=getData(),img=d.photo;
 $("hero").style.setProperty("--art","linear-gradient(90deg,rgba(10,7,10,.2),rgba(10,7,10,.6)),url('"+(images[threat.element]||images.Medo)+"')");

 '<h2>Perícias</h2><div class="skills">'+(d.skills?.length?d.skills.map(v=>'<div class="skill"><span>'+esc(v[0])+'</span><button type="button" data-roll="'+esc(v[1])+'">'+esc(v[1])+' ⚄</button></div>').join(""):'<p class="muted">Perícias ainda não cadastradas.</p>')+'</div>'+
 section("Sentidos",d.senses)+section("Elementos secundários",d.secondary)+section("Imunidades",d.immunities)+section("Resistências",d.resistances)+section("Vulnerabilidades",d.weaknesses);
 $("combat").innerHTML='<div class="action"><h2>Ataques e habilidades</h2><p class="lines">'+esc(d.attacks||"As ações oficiais ainda não foram cadastradas nesta ficha. Consulte o livro de origem.")+'</p></div><div class="note">A barra de PV é local e não sincroniza com a campanha.</div>';
 $("description").innerHTML='<h2>'+esc(threat.name)+'</h2><p class="muted">'+esc(threat.source)+(d.pdfPage?' · PDF página '+d.pdfPage:threat.page?' · livro página '+threat.page:'')+'</p><p class="lines">'+esc(d.description||"Descrição completa ainda não cadastrada. Consulte a obra de origem.")+'</p>';
 hpMax=Number(d.pv)>0?Number(d.pv):null;hpNow=hpMax;

function updateHP(){if(hpMax!==null)$("hpLabel").textContent=hpNow+" / "+hpMax}

function fillEditor(){const d=getData();for(const k of ["vd","pv","defense","movement","description","attacks"])$("f-"+k).value=d[k]??"";for(const k of ["AGI","FOR","INT","PRE","VIG"])$("f-"+k).value=d.attributes?.[k]??"";for(const k of ["skills","senses","secondary","immunities","resistances","weaknesses"])$("f-"+k).value=k==="skills"?(d.skills||[]).map(v=>v.join(" | ")).join("\n"):(d[k]||[]).join("\n");}

function num(k){const s=$("f-"+k).value.trim();return s===""?null:Number(s)}
async function compressPhoto(file){if(file.size>12*1024*1024)throw Error("Imagem maior que 12 MB");return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error("Não foi possível ler a imagem"));reader.onload=()=>{const im=new Image();im.onerror=()=>reject(Error("Imagem inválida"));im.onload=()=>{const c=document.createElement("canvas");c.width=256;c.height=256;const ctx=c.getContext("2d"),scale=Math.max(256/im.width,256/im.height);ctx.drawImage(im,(256-im.width*scale)/2,(256-im.height*scale)/2,im.width*scale,im.height*scale);resolve(c.toDataURL("image/jpeg",.72))};im.src=String(reader.result)};reader.readAsDataURL(file)})}
