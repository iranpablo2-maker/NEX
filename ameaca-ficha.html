<style>
:root{color-scheme:dark;--bg:#0a090c;--panel:#171317;--red:#b42f40;--border:#4d3038;--muted:#c6b2ba}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px/1.5 system-ui,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ef8490;outline-offset:2px}
.shell{max-width:1060px;margin:0 auto;padding:23px 20px 50px}
nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:12px}
nav a{color:#f0c7ce;text-decoration:none;font-weight:600}nav a:hover{text-decoration:underline}
.brand{letter-spacing:.16em;font:700 22px Georgia,serif;color:#fff}
.card{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.hero{display:flex;position:relative;isolation:isolate;gap:20px;padding:24px;min-height:184px;align-items:center;background:var(--art,linear-gradient(110deg,#46131c,#151016));background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#100b10f0,#100b10af 75%,#100b105c)}
.portrait{flex:0 0 144px;height:144px;border-radius:9px;border:1px solid #6e3740;background:#260f17a8;display:grid;place-items:center;font:700 65px Georgia,serif;background-position:center;background-size:cover}
.hero h1{font-size:27px;margin:4px 0 6px;line-height:1.2}.eyebrow{color:#f0b0bb;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tags span{border:1px solid #85404d;background:#351921c9;border-radius:5px;padding:3px 8px;font-size:11px}
.hp{display:flex;align-items:center;background:#a92337;border:1px solid #db4a5f;margin:20px 20px 10px;height:46px;border-radius:7px}
.hp[hidden]{display:none}.hp button{border:0;background:transparent;color:white;font-size:23px;padding:5px 13px}.hp button:hover{background:#ffffff24}.hp strong{flex:1;text-align:center;font-size:17px}
.tabs{display:flex;gap:15px;justify-content:center;padding:12px 12px 0;border-bottom:1px solid #34292d}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:#b8a5ad;padding:10px 14px;text-transform:uppercase;font-size:12px}
.tabs button[aria-selected="true"]{color:white;border-color:#db3d50}
.page{padding:24px}.page[hidden]{display:none}
.attributes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;text-align:center;margin-bottom:22px}
.attributes small{display:block;color:#c7b3bd}.attributes strong{display:block;font:500 28px Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#22171d;border:1px solid #4a323b;border-radius:8px;padding:12px}.stat small{display:block;color:#cdb6be;font-size:11px}.stat strong{font-size:17px}
h2{font-size:18px;font-weight:600;margin:22px 0 9px}.skills{display:grid;gap:6px}
.skill{display:flex;justify-content:space-between;gap:12px;padding:10px;border:1px solid #372b31;border-radius:5px}
.skill button{color:#fff;background:#3b202b;border:1px solid #7c4350;border-radius:5px}
.lines{white-space:pre-line;color:#e7dce0;font-size:13px;margin:0}.muted{color:var(--muted)}.note{border-left:3px solid var(--red);background:#21171c;padding:12px;margin:18px 0;color:#d9bbc5}
.action{border:1px solid #49323a;background:#23181e;padding:14px;border-radius:7px;margin-bottom:10px}
#missing{padding:40px;text-align:center}
@media(max-width:620px){.shell{padding:12px 9px 36px}.hero{padding:12px;gap:11px;min-height:122px}.portrait{flex-basis:96px;height:96px;font-size:40px}.hero h1{font-size:19px}.page{padding:16px 12px}.hp{margin:12px 12px 5px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{gap:2px}.tabs button{padding:10px 8px}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
 .hp-track{height:9px;background:#512630;border-radius:8px;margin:0 20px;overflow:hidden}
.hp-fill{height:100%;width:100%;background:#e1455d;transition:width .25s}
.hp-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 20px}
.hp-controls input{width:96px;border:1px solid #874657;background:#160d13;color:white;border-radius:6px;padding:7px}
.hp-controls button,.dice-button{border:1px solid #9f4050;background:#752a38;color:white;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.hp-controls[hidden],.hp-track[hidden],.dice-output[hidden]{display:none}
.attributes button{background:transparent;border:1px solid #513743;color:white;width:100%;border-radius:7px;cursor:pointer;padding:7px 0}
.attributes button:hover{background:#3b202d}.attributes button small{display:block}
.dice-output{margin:12px 20px;border:1px solid #985365;background:#21161d;padding:12px;border-radius:8px}
.dice-output strong{font-size:18px}.dice-button{margin:8px 5px 0 0}
</style>

function threatKey(x){return x.source+"::"+x.name;}
function threatFacts(x){
 const original=x.source==="Sobrevivendo ao Horror"?(verifiedThreats[x.name]||{}):verifiedAdditionalThreats[threatKey(x)]||verifiedNewThreats[threatKey(x)]||verifiedFollowupThreats[threatKey(x)]||verifiedRemainingThreats[threatKey(x)]||(x.name===screenshotExample.name&&x.source===screenshotExample.source?screenshotExample:{});
 const baseKey=(x.name==="O Anfitrião"&&x.source==="Arquivos Secretos — Abril")?"Livro Básico::O Anfitrião":threatKey(x);
 const extra={...((window.NEX_BASIC_THREATS||{})[baseKey]||{}),...((window.NEX_BASIC_THREATS_EXTRA||{})[baseKey]||{}),...((window.NEX_THREAT_DETAILS||{})[threatKey(x)]||{})};
 let photo="";
 try{const saved=JSON.parse(localStorage.getItem("nex_ameacas_personalizadas_v1")||"{}");const prior=saved?.[threatKey(x)]?.photo;if(typeof prior==="string"&&/^data:image\/(?:png|jpeg|webp);base64,/i.test(prior))photo=prior;}catch(error){}
 if(photo)extra.photo=photo;
 return {...original,...extra,attributes:{...(original.attributes||{}),...(extra.attributes||{})}};
}

const images={Sangue:"./assets/rituais/sangue-fundo.svg",Morte:"./assets/rituais/morte-fundo.svg",Energia:"./assets/rituais/energia-fundo.svg",Conhecimento:"./assets/rituais/conhecimento-fundo.svg",Medo:"./assets/rituais/medo-fundo.svg"};
const $=id=>document.getElementById(id), esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

let hpNow=null,hpMax=null,activeTab="status",hpReady=false;
const combatHpKey="nex_ameaca_pv_sessao::"+key;
function savedHp(max){try{const v=sessionStorage.getItem(combatHpKey);return v===null?max:Math.max(0,Math.min(max,Number(v)||0))}catch(e){return max}}
function rollDice(label,expression,kind){
 const exp=String(expression||"").trim().replaceAll("O","d20").replaceAll("–","-").replaceAll("−","-").replaceAll(" ","");
 const m=exp.match(/^(-)?(\d*)d(\d+)([+-]\d+)?$/i);
 const out=$("diceOutput");out.hidden=false;
 if(!m){out.textContent=label+": dado indisponível ("+exp+")";return}
 const count=Number(m[2]||1),sides=Number(m[3]),bonus=Number(m[4]||0);
 if(count>100||count<1||sides>1000||sides<2)return;
 const values=Array.from({length:count},()=>Math.floor(Math.random()*sides)+1);
 const value=kind==="test"&&sides===20?(m[1]?Math.min(...values):Math.max(...values))+bonus:values.reduce((a,b)=>a+b,0)+bonus;
 out.innerHTML="<div>"+esc(label)+" · "+esc(exp)+"</div><strong>"+esc(value)+"</strong><div class='muted'>Dados: "+esc(values.join(", "))+(bonus?" | Bônus: "+bonus:"")+"</div>";
}

function n(v){return v===null||v===undefined||v===""?"—":v;}
function lines(arr){return Array.isArray(arr)&&arr.length?arr.map(v=>esc(v)).join("<br>"):'<span class="muted">Não cadastrado</span>'}
function section(title,data){return '<h2>'+esc(title)+'</h2><div class="lines">'+lines(data)+'</div>'}
function getData(){return threatFacts(threat)}
function activate(tab){activeTab=tab;for(const x of ["status","combat","description"]){$(x).hidden=x!==tab;document.querySelector('[data-tab="'+x+'"]').setAttribute("aria-selected",String(x===tab))}}
function render(){
 if(!threat)return;
 const d=getData(),img=d.photo;
 $("hero").style.setProperty("--art","linear-gradient(90deg,rgba(10,7,10,.2),rgba(10,7,10,.6)),url('"+(images[threat.element]||images.Medo)+"')");
 $("name").textContent=threat.name;$("source").textContent=threat.source;$("element").textContent=threat.element;
 $("kind").textContent=[d.variant?"Variação de criatura":threat.category||"Criatura",d.size].filter(Boolean).join(" · ");$("vdBadge").textContent="VD "+n(d.vd);
 $("portrait").style.backgroundImage=img?"url("+img+")":"";$("portrait").textContent=img?"":threat.name.slice(0,1);
 const rollRows=items=>Array.isArray(items)&&items.length?items.map(v=>'<div class="skill"><span>'+esc(v[0])+'</span><button type="button" data-roll="'+esc(v[1])+'" aria-label="Rolar '+esc(v[0])+'">'+esc(v[1])+' ⚄</button></div>').join(""):'<p class="muted">Não informado no material consultado.</p>';
 const actionRows=Array.isArray(d.actions)&&d.actions.length?d.actions.map(a=>{
 const name=a.name||"Ação",test=String(a.test||""),dmg=String(a.damage||"");
 const diceMatch=dmg.match(/\d+d\d+(?:\s*[+-]\s*\d+)?/i);
 return '<div class="action"><small class="muted">'+esc(a.type||"Ação")+'</small><strong style="display:block;margin:3px 0 5px">'+esc(name)+'</strong>'+
 (test?'<div>Teste: '+esc(test)+'</div><button type="button" class="dice-button" data-action-roll="test" data-dice="'+esc(test)+'" data-label="'+esc(name)+'">⚄ Rolar ataque</button>':'')+
 (dmg?'<div>Dano: '+esc(dmg)+'</div>':'')+
 (diceMatch?'<button type="button" class="dice-button" data-action-roll="damage" data-dice="'+esc(diceMatch[0])+'" data-label="'+esc(name)+'">⚄ Rolar dano</button>':'')+'</div>';
 }).join(""):'';
 const stats='<div class="stats"><div class="stat"><small>Defesa</small><strong>'+esc(n(d.defense))+'</strong></div><div class="stat"><small>Deslocamento</small><strong>'+esc(n(d.movement))+'</strong></div><div class="stat"><small>PV máximos</small><strong>'+esc(n(d.pv))+'</strong></div></div>';
 $("status").innerHTML='<div class="attributes">'+["AGI","FOR","INT","PRE","VIG"].map(x=>'<div><small>'+x+'</small><button type="button" data-attr="'+x+'"><strong>'+esc(n(d.attributes?.[x]))+'</strong><small>⚄ Rolar</small></button></div>').join("")+'</div>'+
 stats+(d.presence?'<div class="note"><strong>Presença perturbadora:</strong> '+esc(d.presence)+'</div>':'')+
 (d.extraMovement?.length?section("Outros deslocamentos",d.extraMovement):"")+
 '<h2>Testes de resistência</h2><div class="skills">'+rollRows(d.saves)+'</div>'+
 '<h2>Perícias</h2><div class="skills">'+rollRows(d.skills)+'</div>'+
 section("Sentidos",d.senses)+section("Elementos secundários",d.secondary)+section("Imunidades",d.immunities)+section("Resistências",d.resistances)+section("Vulnerabilidades",d.weaknesses);
 const abilityRows=Array.isArray(d.abilities)&&d.abilities.length?'<h2>Habilidades especiais</h2>'+d.abilities.map(a=>'<div class="action"><strong style="display:block">'+esc(a.name)+'</strong><p class="lines">'+esc(a.effect||"Consulte o livro para o efeito completo.")+'</p></div>').join(""):"";
 $("combat").innerHTML='<h2>Ataques e habilidades</h2>'+(actionRows||'<p class="muted">Ainda não há ações verificadas nesta ficha.</p>')+abilityRows+(d.attacks?'<div class="action"><p class="lines">'+esc(d.attacks)+'</p></div>':'')+
 '<div class="note">Os valores disponíveis são referências para a mesa. Para condições, gatilhos e efeitos completos, consulte a fonte indicada na aba Descrição. A barra de PV é temporária e não altera a ficha oficial.</div>';
 $("description").innerHTML='<h2>'+esc(threat.name)+'</h2><p class="muted">'+esc(threat.source)+(d.pdfPage?' · PDF, página '+d.pdfPage:threat.page?' · livro, página '+threat.page:'')+'</p>'+
 '<p class="lines">'+esc(d.description||"Ficha de consulta com dados do catálogo. As descrições narrativas e os efeitos completos das habilidades estão no livro indicado.")+'</p>'+
 (d.pdfPage?'<p class="note">Dados numéricos e nomes de ações conferidos na página informada do PDF fornecido.</p>':'<p class="note">Os valores ausentes não foram preenchidos sem conferência da fonte original.</p>');
 hpMax=Number(d.pv)>0?Number(d.pv):null;if(!hpReady){hpNow=hpMax===null?null:savedHp(hpMax);hpReady=true}
 $("hpBar").hidden=hpMax===null;$("hpTrack").hidden=hpMax===null;$("hpControls").hidden=hpMax===null;updateHP();
 activate(activeTab);
}
function updateHP(){
 if(hpMax===null)return;
 $("hpLabel").textContent=hpNow+" / "+hpMax+" PV";
 $("hpFill").style.width=Math.max(0,Math.min(100,100*hpNow/hpMax))+"%";
 try{sessionStorage.setItem(combatHpKey,String(hpNow))}catch(e){}
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)activate(b.dataset.tab)});
$("hpBar").addEventListener("click",e=>{const b=e.target.closest("[data-change]");if(!b||hpMax===null)return;hpNow=Math.max(0,Math.min(hpMax,hpNow+Number(b.dataset.change)));updateHP()});
$("hpControls").addEventListener("click",e=>{
 const b=e.target.closest("[data-hp-action]");if(!b||hpMax===null)return;
 const amount=Math.max(1,Math.min(100000,Math.floor(Number($("hpAmount").value)||1)));
 if(b.dataset.hpAction==="damage")hpNow=Math.max(0,hpNow-amount);
 if(b.dataset.hpAction==="heal")hpNow=Math.min(hpMax,hpNow+amount);
 if(b.dataset.hpAction==="reset")hpNow=hpMax;updateHP();
});
$("status").addEventListener("click",e=>{
 const attr=e.target.closest("[data-attr]");
 if(attr){const value=getData().attributes?.[attr.dataset.attr];if(value===undefined||value===null||value==="—"||Number(value)<0)return;rollDice("Atributo "+attr.dataset.attr,Math.max(1,Number(value))+"d20","test");return}
 const b=e.target.closest("[data-roll]");if(b)rollDice("Perícia ou resistência",b.dataset.roll,"test");
});
$("combat").addEventListener("click",e=>{
 const b=e.target.closest("[data-action-roll]");if(!b)return;
 rollDice(b.dataset.label,b.dataset.dice,b.dataset.actionRoll);
});

if(embedded){
